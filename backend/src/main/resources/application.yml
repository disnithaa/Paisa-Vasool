spring:
  application:
    name: paisa-vasool-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paisa_vasool}
    username: ${DB_USERNAME:paisa}
    password: ${DB_PASSWORD:paisa123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app
    default-schema: app
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}
    email: ${DEV_AUTH_EMAIL:dev@paisavasool.local}
    name: ${DEV_AUTH_NAME:Local Developer}
    password: ${DEV_AUTH_PASSWORD:dev-only-change-me}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
