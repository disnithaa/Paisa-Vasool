services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paisa_vasool}
      POSTGRES_USER: ${POSTGRES_USER:-paisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

  optimizer:
    build:
      context: ../optimizer
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paisa_vasool}
      DB_USERNAME: ${POSTGRES_USER:-paisa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DEV_AUTH_ENABLED: "true"
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-dev@paisavasool.local}
      DEV_AUTH_NAME: ${DEV_AUTH_NAME:-Local Developer}
      DEV_AUTH_PASSWORD: ${DEV_AUTH_PASSWORD:?Set DEV_AUTH_PASSWORD in .env}
      OPTIMIZER_BASE_URL: http://optimizer:8000
      OPTIMIZER_CONNECT_TIMEOUT: ${OPTIMIZER_CONNECT_TIMEOUT:-1s}
      OPTIMIZER_READ_TIMEOUT: ${OPTIMIZER_READ_TIMEOUT:-3s}
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
